        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g class="icon-main" filter="url(#shadow)">
    <path d="M 5 4 L 19 4 L 19 7 L 15 7 L 15 10 L 19 10 L 19 13 L 15 13 L 15 16 L 19 16 L 19 20 L 5 20 L 5 16 L 9 16 L 9 13 L 5 13 L 5 10 L 9 10 L 9 7 L 5 7 Z"/>
    <path d="M 7 6 L 17 6 L 17 8 L 13 8 L 13 11 L 17 11 L 17 14 L 13 14 L 13 17 L 7 17 L 7 14 L 11 14 L 11 11 L 7 11 Z"/>
    <path d="M 9 9 L 11 9"/>
    <path d="M 13 9 L 15 9"/>
  </g>
  <g class="icon-accent">
    <path d="M 7 6 L 17 6"/>
  </g>
</svg>
