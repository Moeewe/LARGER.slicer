<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Outer gear (main settings) -->
    <circle cx="12" cy="12" r="7" stroke="#000000" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="12" r="2.5" stroke="#000000" stroke-width="1.5" fill="none"/>
    <path d="M 12 4 L 12 6 M 12 18 L 12 20 M 4 12 L 6 12 M 18 12 L 20 12 M 6.5 6.5 L 8 8 M 17.5 17.5 L 16 16 M 6.5 17.5 L 8 16 M 17.5 6.5 L 16 8" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Inner gear ring (multi-zone indicator) - more visible -->
    <circle cx="12" cy="12" r="4.5" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <!-- Zone indicators as larger squares (more visible) -->
    <rect x="8" y="8" width="2" height="2" fill="#0066CC"/>
    <rect x="14" y="8" width="2" height="2" fill="#0066CC"/>
    <rect x="8" y="14" width="2" height="2" fill="#0066CC"/>
    <rect x="14" y="14" width="2" height="2" fill="#0066CC"/>
    <!-- Center vertical line (blue accent) -->
    <path d="M 12 10 L 12 14" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
