<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Curve path (black) -->
    <path d="M 4 12 Q 8 6, 12 10 Q 16 14, 20 10" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Pipe segments along curve (blue accent) - representing extrusion -->
    <circle cx="6" cy="10.5" r="1.2" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <circle cx="10" cy="8.5" r="1.5" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <circle cx="14" cy="9.5" r="1.5" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <circle cx="18" cy="9" r="1.2" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <!-- Connection lines between pipes (blue accent) -->
    <line x1="6" y1="10.5" x2="10" y2="8.5" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="8.5" x2="14" y2="9.5" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="9.5" x2="18" y2="9" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
