<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Left: GCode symbol (code brackets) -->
    <path d="M 3 7 L 3 17 M 3 7 L 5 9 M 3 17 L 5 15" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="10" x2="6" y2="10" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="6" y2="12" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="14" x2="5.5" y2="14" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Center: Large transformation/processing gear -->
    <circle cx="12" cy="12" r="5" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <!-- Gear teeth -->
    <path d="M 12 7 L 12.8 8.5 L 14.5 8 L 13.7 9.5 L 15.5 10 L 13.7 10.5 L 14.5 12 L 12.8 11.5 L 12 13 L 11.2 11.5 L 9.5 12 L 10.3 10.5 L 8.5 10 L 10.3 9.5 L 9.5 8 L 11.2 8.5 Z" stroke="#0066CC" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="1.5" stroke="#0066CC" stroke-width="1.2" fill="none"/>
    
    <!-- Right: DXR output (arrow/result) -->
    <path d="M 17 7 L 17 17 M 17 7 L 19 9 M 17 17 L 19 15" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="10" x2="20" y2="10" stroke="#0066CC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="12" x2="20" y2="12" stroke="#0066CC" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="14" x2="19.5" y2="14" stroke="#0066CC" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
