<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <style>
        .icon-main { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-accent { stroke: #0066CC; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-fill { fill: #000000; stroke: none; }
    </style>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g class="icon-main" filter="url(#shadow)">
    <path d="M 4 8 Q 8 6 12 8 T 20 8"/>
    <path d="M 4 12 Q 8 10 12 12 T 20 12"/>
    <path d="M 4 16 Q 8 14 12 16 T 20 16"/>
    <path d="M 6 8 L 8 8 M 7 7 L 8 8 L 7 9"/>
    <path d="M 6 12 L 8 12 M 7 11 L 8 12 L 7 13"/>
    <path d="M 6 16 L 8 16 M 7 15 L 8 16 L 7 17"/>
  </g>
  <g class="icon-accent">
    <path d="M 6 8 L 8 8 M 7 7 L 8 8 L 7 9"/>
  </g>
</svg>
