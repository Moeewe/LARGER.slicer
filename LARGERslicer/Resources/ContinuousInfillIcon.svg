<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <style>
        .icon-main { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-accent { stroke: #0066CC; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-fill { fill: #000000; stroke: none; }
    </style>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g class="icon-main" filter="url(#shadow)">
    <path d="M 4 6 Q 6 4 8 6 Q 10 4 12 6 Q 14 4 16 6 Q 18 4 20 6"/>
    <path d="L 20 10 Q 18 12 20 14 Q 18 16 20 18"/>
    <path d="L 16 18 Q 14 20 12 18 Q 10 20 8 18 Q 6 20 4 18"/>
    <path d="L 4 14 Q 6 12 4 10 Z"/>
    <path d="M 6 8 Q 8 6 10 8 Q 12 6 14 8 Q 16 6 18 8"/>
    <path d="L 18 12 Q 16 14 18 16"/>
    <path d="L 14 16 Q 12 18 10 16 Q 8 18 6 16"/>
    <path d="L 6 12 Q 8 10 6 8"/>
    <path d="M 8 10 Q 10 8 12 10 Q 14 8 16 10"/>
    <path d="L 16 14 Q 14 16 12 14 Q 10 16 8 14 Z"/>
    <path d="M 10 12 L 14 12"/>
    <path d="M 12 10 L 12 14"/>
  </g>
  <g class="icon-accent">
    <path d="M 8 10 Q 10 8 12 10 Q 14 8 16 10"/>
  </g>
</svg>
