<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Floppy disk body -->
    <rect x="6" y="4" width="12" height="16" stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <!-- Metal slider (top, filled) -->
    <rect x="7" y="5" width="10" height="2" stroke="#000000" stroke-width="1" fill="#000000"/>
    <!-- Label area (center) -->
    <rect x="8" y="8" width="8" height="6" stroke="#000000" stroke-width="1" fill="none"/>
    <!-- Corner cutout (bottom right) -->
    <path d="M 18 18 L 18 20 L 16 20" stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <!-- Center hole -->
    <circle cx="12" cy="11" r="1.5" stroke="#000000" stroke-width="1" fill="none"/>
    <!-- Blue accent: save arrow pointing down -->
    <path d="M 12 8 L 12 10 M 12 8 L 11 9 M 12 8 L 13 9" stroke="#0066CC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
