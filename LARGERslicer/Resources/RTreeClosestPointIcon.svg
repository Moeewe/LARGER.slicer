<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="8" cy="8" r="1.5" fill="#000000"/>
    <circle cx="16" cy="8" r="1.5" fill="#000000"/>
    <circle cx="8" cy="16" r="1.5" fill="#000000"/>
    <circle cx="16" cy="16" r="1.5" fill="#000000"/>
    <circle cx="12" cy="12" r="2.5" stroke="#0066CC" stroke-width="1.5" fill="none"/>
    <line x1="12" y1="12" x2="8" y2="8" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="12" y1="12" x2="16" y2="8" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="12" y1="12" x2="8" y2="16" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="12" y1="12" x2="16" y2="16" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
  </g>
</svg>