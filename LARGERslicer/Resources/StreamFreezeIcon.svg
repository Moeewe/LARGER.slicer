<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="7" y="4" width="3" height="16" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="14" y="4" width="3" height="16" stroke="#0066CC" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>