<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="6" y="4" width="12" height="16" stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <rect x="8" y="6" width="8" height="6" stroke="#000000" stroke-width="1.5" fill="#000000"/>
    <rect x="8" y="14" width="8" height="2" stroke="#000000" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 8 14 L 8 14" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>