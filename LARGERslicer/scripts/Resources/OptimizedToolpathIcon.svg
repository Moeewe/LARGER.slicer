<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Multiple separate curves (left side) -->
    <path d="M 4 6 Q 6 4 8 6" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 4 10 Q 6 8 8 10" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 4 14 Q 6 12 8 14" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 4 18 Q 6 16 8 18" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Optimized continuous path (right side) with connections -->
    <path d="M 10 6 Q 12 4 14 6 Q 16 8 18 10 Q 16 12 14 14 Q 12 16 10 18" stroke="#0066CC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Connection lines showing optimization -->
    <line x1="8" y1="6" x2="10" y2="6" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="8" y1="10" x2="10" y2="8" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="8" y1="14" x2="10" y2="12" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
    <line x1="8" y1="18" x2="10" y2="18" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-dasharray="1,1"/>
  </g>
</svg>