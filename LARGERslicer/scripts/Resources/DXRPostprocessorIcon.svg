<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="4" y="6" width="6" height="12" stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <line x1="5" y1="9" x2="9" y2="9" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="8" y2="12" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="5" y1="15" x2="9" y2="15" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <path d="M 10 12 L 14 10 L 14 14 Z" stroke="#0066CC" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="6" width="6" height="12" stroke="#000000" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <line x1="17" y1="9" x2="21" y2="9" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="12" x2="20" y2="12" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="15" x2="21" y2="15" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>