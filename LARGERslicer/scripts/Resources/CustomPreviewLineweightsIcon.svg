<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.33"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <line x1="4" y1="8" x2="20" y2="8" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="20" y2="12" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="20" y2="16" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>